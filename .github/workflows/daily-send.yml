name: Daily sponsorship outreach

on:
  schedule:
    # 16:00 UTC = 9:00 AM Pacific (8:00 AM during standard time)
    - cron: "0 16 * * *"
  workflow_dispatch: {}

# Never let two runs overlap — overlapping runs could double-send.
concurrency:
  group: daily-send
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send-and-check:
    runs-on: ubuntu-latest
    # Worst case: ~30 staggered sends x up to 5 min apart.
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily send-and-check
        run: npm run send
        env:
          client_id: ${{ secrets.client_id }}
          project_id: ${{ secrets.project_id }}
          auth_uri: ${{ secrets.auth_uri }}
          token_uri: ${{ secrets.token_uri }}
          auth_provider_x509_cert_url: ${{ secrets.auth_provider_x509_cert_url }}
          client_secret: ${{ secrets.client_secret }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_CONTACT: ${{ secrets.SENDER_CONTACT }}

      # Last-resort copy of the send record. If the push below fails for any
      # reason, the runner is destroyed and the record of who was emailed goes
      # with it — which is exactly how 2026-08-04's sends were lost and then
      # re-sent the next day. This artifact survives that.
      - name: Upload contact statuses as a recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contacts-run-${{ github.run_number }}
          path: data/contacts.csv
          retention-days: 30

      # The CSV is the bot's entire memory of who was emailed and when.
      # It must be committed even if the send step failed partway through.
      - name: Commit updated contact statuses
        if: always()
        run: |
          if git diff --quiet -- data/contacts.csv; then
            echo "No contact changes to commit."
            exit 0
          fi
          git config user.name "outreach-bot"
          git config user.email "actions@github.com"

          # A plain `git push` is rejected if the branch moved while we were
          # sending (a run takes hours), and the record is then lost — causing
          # tomorrow's run to email this batch a second time. Retry onto the
          # new tip instead. This workflow is the only writer of contacts.csv,
          # so on a race our just-written copy is the authoritative one.
          cp data/contacts.csv "$RUNNER_TEMP/contacts.csv"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/contacts.csv" data/contacts.csv
            if git diff --quiet -- data/contacts.csv; then
              echo "Contact statuses already current on origin; nothing to push."
              exit 0
            fi
            git add data/contacts.csv
            git commit -m "Update contact statuses ($(date -u +%F))"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed contact statuses on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt of 5); retrying onto new tip..."
            sleep $((attempt * 5))
          done

          echo "::error::Emails were SENT but the record could not be pushed after 5 attempts. Download the contacts-run-${{ github.run_number }} artifact and commit it BEFORE the next run, or that batch will be emailed twice."
          exit 1
